# dev-spec-text-search-description-phase15 §6.4 W2_ANATOMY_EN
#
# Whitelist of safe anatomical region + sequence tokens that may appear in
# DICOM StudyDescription / SeriesDescription / ProtocolName. Tokens here
# survive PHI scrub even if they collide with a name regex (e.g. "HAND"
# could otherwise be tagged R1_PATIENT_NAME_EN initial).
#
# Sourced from:
#   - DICOM CID 4 / 4031 (Anatomic Region) — body parts.
#   - DICOM CID 7180 (MR Acquisition Plane / Sequence) — T1, T2, FLAIR, etc.
#   - Radiology common-usage abbreviations (ABD, PEL, LSS, TSS, CSS).
#   - Plane modifiers (AX, AXIAL, COR, CORONAL, SAG, SAGITTAL, OBL, OBLIQUE).
#
# Tokens are matched WHOLE-WORD case-insensitive after Unicode NFKC.
