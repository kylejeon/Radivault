# dev-spec-text-search-description-phase15 §6.4 R3_INSTITUTION
#
# Korean top-30 general-hospital identifier tokens to strip from DICOM
# StudyDescription / SeriesDescription / ProtocolName free-text after the
# DCM 113105 baseline pass. Tokens are matched whole-word, case-insensitive
# (English/transliterated) or substring-equal (Hangul) inside a token.
#
# Operating policy:
# - Hot-reloadable from disk (extract_text.py reads at module import + checks
#   mtime each gateway sync cycle).
# - Adding a token requires PR review + scrub_version bump (Phase 1.5 → 1.6).
# - Tokens MUST be the institution identifier itself, never a person name —
#   person names are R1_PATIENT_NAME_* aggressive regex.
#
# Coverage rationale: top-30 by inpatient bed count + top tertiary-referral
# centres (상급종합병원). Western/teaching-hospital tokens included for
# multi-site studies (MGH, Mayo, Stanford) so foreign Reading rooms that
# emit institution-tagged descriptions are also redacted.
version: "1.5.0"
tokens:
  # Tertiary referral hospitals — Hangul.
  - 서울대병원
  - 서울대학교병원
