# RadiVault Gateway Agent — docker-compose container configuration.
#
# Multi-PACS sync (dev-spec-multi-pacs-sync.md FR-MPS-7): single gateway
# container iterates Orthanc-A + Orthanc-B sequentially. Each endpoint's
# study lands in central with the right hospital_id (HOSP-001 / HOSP-002)
# via the per-hospital upload_tokens map (FR-MPS-6 / K-MPS-6).
#
# Tokens are resolved via ${env:...} in container mode so secrets stay
# out of the image. Operators set HOSP_001_TOKEN / HOSP_002_TOKEN in the
# container env (e.g. compose `env_file:` directive). Falls back to the
# legacy upload_token if the per-hospital map misses.

version: 1

agent:
  gateway_id: "gw_dev_local"
  hospital_id: "HOSP-001"
  org_root_oid: "2.25.140737488355328"

pacs:
  - id: "orthanc-a"
    hospital_id: "HOSP-001"
    base_url: "http://orthanc:8042/dicom-web"
    auth:
      type: "basic"
      username: "orthanc"
      password: "orthanc"
    max_concurrency: 2
    poll_interval_seconds: 60
    priority: 10
    enabled: true
    query:
      modalities: ["CR", "CT", "MR", "DX", "MG", "PT"]
      lookback_days: 30

  - id: "orthanc-b"
    hospital_id: "HOSP-002"
    base_url: "http://orthanc-b:8042/dicom-web"
    auth:
      type: "basic"
      username: "orthanc"
      password: "orthanc"
    max_concurrency: 2
    poll_interval_seconds: 60
    priority: 20
    enabled: true
    query:
      modalities: ["CR", "CT", "MR", "DX", "MG", "PT"]
      lookback_days: 30

deid:
  ruleset_version: "v0.1.0"
  salt: "${file:/run/credentials/salt}"
  salt_version: 1
  burnin_quarantine_modalities: ["SC", "US", "OT"]
  retain_options:
    longitudinal_dates: true
    patient_characteristics: true
    clean_descriptors: true
    clean_graphics: true
    safe_private: false
    uids: false
    institution_identity: false
    device_identity: "partial"

staging:
  root: "/var/lib/radivault/staging"
  retention_hours: 72
  max_disk_pct: 80

state:
  db_path: "/var/lib/radivault/state.sqlite3"

audit:
  path: "/var/log/radivault/audit.log"
  anchor_interval_seconds: 3600

central:
  base_url: "http://mock-central:8080"
  # Per-hospital tokens — populated from container env.
  upload_tokens:
    HOSP-001: "${env:HOSP_001_TOKEN}"
    HOSP-002: "${env:HOSP_002_TOKEN}"
  # Legacy fallback for any hospital_id not in upload_tokens.
  upload_token: "mock-upload-token"
  upload_timeout_seconds: 120
  max_upload_retries: 3

logging:
  level: "INFO"
  json: true
  console_color: "never"
