[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "radivault-gateway"
version = "0.1.0"
description = "RadiVault Gateway Agent + Central Ingest — on-prem PACS → De-ID → Central uploader and Zone 2 ingest service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RadiVault" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydicom>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mock = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
central = [
    # Core web stack
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=21.2",
    "python-multipart>=0.0.9",
    # Persistence
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Cache / idempotency / rate limit
    "redis>=5.0",
    "slowapi>=0.1.9",
    # Object storage
    "boto3>=1.34",
    # Auth
    "argon2-cffi>=23.0",
    # Observability
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-json-logger>=2.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    # ULIDs for request_id / job_id
    "python-ulid>=2.0",
]
central-test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.20",
]
search = [
    # Core web stack — share central's foundations.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=21.2",
    # Persistence.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Cache / rate limit.
    "redis>=5.0",
    "slowapi>=0.1.9",
    # Auth.
    "argon2-cffi>=23.0",
    # Observability.
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-json-logger>=2.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    # ULIDs.
    "python-ulid>=2.0",
]
search-test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.20",
]
# v0.2 de-id-pixel: OCR + 3D defacing (opt-in; included in :0.2.0-pixel image).
pixel = [
    "pytesseract>=0.3.13",
    "pydeface>=2.0",
    "nibabel>=5.2",
    "numpy>=1.26",
    "Pillow>=10.3",
    "opencv-python-headless>=4.9",
]
# Optional PaddleOCR path (:0.2.0-pixel-paddle image).
pixel-paddle = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]

[project.scripts]
radivault-gateway = "radivault_gateway.cli.main:cli"
radivault-central = "radivault_central.__main__:main"
ingest-admin = "radivault_central_admin.cli:cli"
radivault-search = "radivault_search.__main__:main"
search-admin = "radivault_search_admin.cli:cli"

[tool.hatch.build.targets.wheel]
packages = [
    "src/radivault_gateway",
    "src/radivault_mock_central",
    "src/radivault_central",
    "src/radivault_central_admin",
    "src/radivault_search",
    "src/radivault_search_admin",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring external services (Orthanc, docker); skipped by default",
    "search_integration: integration tests for radivault_search; gated by SEARCH_TEST_SERVICES=1",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydicom.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg (click / FastAPI patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"alembic/**" = ["E402", "F401"]
