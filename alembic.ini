[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# default DSN; overridden at runtime via ingest-admin migrate or env vars.
sqlalchemy.url = postgresql+psycopg://central_migrator:central_migrator@localhost:5432/central

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
