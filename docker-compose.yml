# Local development / pilot setup.
# Three services:
#   gateway-agent : the actual agent (runs `start`)
#   mock-central  : FastAPI mock of the central ingest/audit endpoints
#   orthanc       : DICOMweb PACS for end-to-end integration tests
#
# Secrets live in ./secrets (chmod 0600 recommended); real deployment should
# use systemd `LoadCredential=` and mount /run/credentials instead.
#
# Network topology (jpg-preview-defacing AC-21):
#   - default          : the implicit compose bridge that gateway-agent
#                        uses to reach mock-central / orthanc / orthanc-b.
#   - deface-net       : INTERNAL-ONLY (no upstream gateway, no public
#                        egress). Both gateway-agent and deface-sidecar
#                        attach so the gateway can POST /deface but the
#                        sidecar cannot reach the public internet — see
#                        docker/afni-refacer/NETWORKING.md for verification.

networks:
  default: {}
  deface-net:
    driver: bridge
    internal: true

services:
  gateway-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: radivault-gateway:0.1.0
    restart: unless-stopped
    depends_on:
      - mock-central
      - orthanc
      - deface-sidecar
    environment:
      RADIVAULT_CONFIG: /etc/radivault/gateway.yml
      NO_COLOR: "1"
      # jpg-preview-defacing FR-DEFACE-6: gateway calls this URL to invoke
      # @afni_refacer_run on a per-series basis. Internal compose DNS only.
      DEFACE_SIDECAR_URL: "http://deface-sidecar:8090"
      # FR-PREVIEW-3: feature flag — keep OFF in pilot dockerised runs
      # until Kyle flips it during D-13 sync. process_study() short-circuits
      # to PreviewBatchResult(skipped=True, reason="flag_off") when false.
      PREVIEW_PIPELINE_ENABLED: "false"
    networks:
      - default      # mock-central / orthanc / orthanc-b reachable via this
      - deface-net   # AC-21: gateway is the ONLY peer of the sidecar
    volumes:
      - ./configs/gateway.docker.yaml:/etc/radivault/gateway.yml:ro
      - ./secrets:/run/credentials:ro
      - gateway-state:/var/lib/radivault
      - gateway-logs:/var/log/radivault

  # jpg-preview-defacing FR-DEFACE-5 — AFNI defacing sidecar.
  #
  # Runs the AFNI @afni_refacer_run pipeline for head/neck CT/MR series.
  # Gateway-agent calls POST /deface over the internal compose network;
  # nothing on the public internet should be able to reach this service
  # (FR-DEFACE-5 + AC-21).
  #
  # Memory: 4 GiB hard limit per Kyle 2026-04-27 (dev-spec §11 Q6 default).
  # OOM-killed runs are surfaced as 500 by the supervising compose +
  # quarantined by the gateway preview_pipeline (FR-DEFACE-8 runtime path).
  deface-sidecar:
    build:
      context: ./docker/afni-refacer
      dockerfile: Dockerfile
    image: radivault/deface-sidecar:0.1.0
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g  # disable swap (Kyle Q6 default)
    # AC-21: pin to the internal-only network so apt-get / pip / curl-out
    # all fail at runtime. The gateway-agent is also attached to deface-net
    # so POST /deface still works.
    networks:
      - deface-net
    environment:
      SIDECAR_IMAGE_TAG: "radivault/deface-sidecar:0.1.0"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mock-central:
    build:
      context: .
      dockerfile: Dockerfile
    image: radivault-gateway:0.1.0
    command: >
      python -m uvicorn radivault_mock_central.main:app
      --host 0.0.0.0 --port 8080
    environment:
      MOCK_CENTRAL_TOKEN: mock-upload-token
      MOCK_CENTRAL_DUMP: /tmp/mock-central
    ports:
      - "8080:8080"
    volumes:
      - mock-central-dump:/tmp/mock-central

  orthanc:
    image: jodogne/orthanc-plugins:latest
    restart: unless-stopped
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      ORTHANC_NAME: radivault-dev
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
    volumes:
      - orthanc-data:/var/lib/orthanc/db

  # Second PACS for the D-13 multi-hospital demo. Owned by HOSP-002
  # ("튼튼병원" / region_pseudo=BUSAN-B). Starts empty; the first study
  # arrives live during the demo via STOW (see scripts/demo_setup/
  # demo_live_upload.sh). Listens on host 8043 (HTTP/DICOMweb) and 4243
  # (DIMSE) to coexist with orthanc-1 (8042/4242).
  orthanc-b:
    image: jodogne/orthanc-plugins:latest
    restart: unless-stopped
    ports:
      - "8043:8042"
      - "4243:4242"
    environment:
      ORTHANC_NAME: radivault-hosp-002
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
    volumes:
      - orthanc-b-data:/var/lib/orthanc/db

volumes:
  gateway-state:
  gateway-logs:
  mock-central-dump:
  orthanc-data:
  orthanc-b-data:
